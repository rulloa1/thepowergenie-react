<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240">
  <defs>
    <!-- Emerald to Cyan Athletic Gradient -->
    <linearGradient id="lEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3"/>
      <stop offset="60%" stop-color="#00E599"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <!-- Metallic Platinum/Silver Gradient for SPORT -->
    <linearGradient id="lSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Championship Gold Gradient for SOLAR -->
    <linearGradient id="lGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Deep Shield Core -->
    <linearGradient id="lShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2236"/>
      <stop offset="100%" stop-color="#040d16"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="lGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow for Crest -->
  <circle cx="210" cy="65" r="55" fill="url(#lEmerald)" opacity="0.28" filter="url(#softGlow)"/>

  <!-- ========================================== -->
  <!-- TOP EMBLEM: ATHLETIC ENERGY CREST           -->
  <!-- ========================================== -->
  <g transform="translate(210, 65) scale(0.25) translate(-256, -245)">
    <!-- Shield Outer -->
    <path d="M 256,40 L 420,105 C 420,290 350,395 256,468 C 162,395 92,290 92,105 Z"
          fill="none" stroke="url(#lEmerald)" stroke-width="16" stroke-linejoin="round" filter="url(#lGlow)"/>
    <!-- Shield Body -->
    <path d="M 256,60 L 400,118 C 400,278 338,375 256,442 C 174,375 112,278 112,118 Z"
          fill="url(#lShield)" stroke="url(#lGold)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Solar Orbit Ring -->
    <ellipse cx="256" cy="245" rx="120" ry="120" fill="none" stroke="rgba(0, 229, 153, 0.4)" stroke-width="3" stroke-dasharray="10 8"/>
    <!-- Apex Star -->
    <polygon points="256,82 262,96 277,96 265,105 269,119 256,110 243,119 247,105 235,96 250,96" fill="url(#lGold)"/>
    <!-- Kinetic Lightning Bolt -->
    <polygon points="285,115 175,260 252,260 215,385 345,230 268,230" fill="#022c22"/>
    <polygon points="280,120 180,265 255,265 220,380 340,235 265,235"
             fill="url(#lEmerald)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
    <!-- Bolt Center Lens Flare -->
    <circle cx="255" cy="265" r="9" fill="#FFFFFF"/>
    <line x1="220" y1="265" x2="290" y2="265" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <line x1="255" y1="230" x2="255" y2="300" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <!-- Chevrons -->
    <path d="M 175,340 L 256,400 L 337,340" fill="none" stroke="url(#lEmerald)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 195,372 L 256,418 L 317,372" fill="none" stroke="url(#lGold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ========================================== -->
  <!-- MAIN TYPOGRAPHY: SPORT & SOLAR             -->
  <!-- ========================================== -->
  <g id="brandTypography">
    <!-- "SPORT" Text -->
    <text x="75" y="172"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-weight="900"
          font-size="44"
          font-style="italic"
          letter-spacing="2"
          fill="url(#lSilver)"
          stroke="#06121f"
          stroke-width="1.5"
          paint-order="stroke fill"
          filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">SPORT</text>

    <!-- Kinetic Ampersand "&" in Emerald -->
    <text x="228" y="171"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-weight="900"
          font-size="34"
          font-style="italic"
          fill="url(#lEmerald)"
          filter="url(#lGlow)">&amp;</text>

    <!-- "SOLAR" Text -->
    <text x="264" y="172"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-weight="900"
          font-size="44"
          font-style="italic"
          letter-spacing="2"
          fill="url(#lEmerald)"
          stroke="#06121f"
          stroke-width="1.5"
          paint-order="stroke fill"
          filter="drop-shadow(0 4px 12px rgba(0,229,153,0.35))">SOLAR</text>
  </g>

  <!-- ========================================== -->
  <!-- SUBTITLE: HIGH PERFORMANCE ENERGY          -->
  <!-- ========================================== -->
  <g transform="translate(0, 204)">
    <!-- Left Wing Rule Line with Diamond Tip -->
    <line x1="45" y1="0" x2="115" y2="0" stroke="url(#lEmerald)" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
    <polygon points="118,0 115,-3 112,0 115,3" fill="#00E599"/>

    <!-- High-Performance Energy Text -->
    <text x="210" y="4"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
          font-weight="700"
          font-size="11.5"
          letter-spacing="4.5"
          text-anchor="middle"
          fill="#E2E8F0"
          opacity="0.92">HIGH PERFORMANCE ENERGY</text>

    <!-- Right Wing Rule Line with Diamond Tip -->
    <polygon points="302,0 305,-3 308,0 305,3" fill="#00E599"/>
    <line x1="305" y1="0" x2="375" y2="0" stroke="url(#lEmerald)" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>

